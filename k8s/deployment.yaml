apiVersion: apps/v1
kind: Deployment
metadata:
  name: mood-agent
  labels:
    app: mood-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mood-agent
  template:
    metadata:
      labels:
        app: mood-agent
    spec:
      containers:
        - name: mood-agent
          image: mood-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mood-agent-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
