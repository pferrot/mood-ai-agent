apiVersion: v1
kind: ConfigMap
metadata:
  name: mood-agent-config
  labels:
    app: mood-agent
data:
  LANGCHAIN_TRACING_V2: "false"
  MODEL_NAME: "qwen3.5:0.8b"
  ENABLE_REASONING: "false"
  # Point to the in-cluster Ollama service (see ollama-service.yaml)
  OLLAMA_BASE_URL: "http://ollama:11434"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  LOG_LEVEL: "info"
